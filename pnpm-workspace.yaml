packages:
  - client
  - debug-recorder-admin
  - sdk
  - figma-plugin
  - .
allowBuilds:
  # embedded-postgres ships a per-platform binary whose install script must run.
  # Allow every platform variant so the build is approved on CI (linux-x64) and
  # on any contributor's machine, not just Apple Silicon — otherwise pnpm v11
  # fails `--frozen-lockfile` with ERR_PNPM_IGNORED_BUILDS.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-ia32': true
  '@embedded-postgres/linux-ppc64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@ant-design/icons'
  - '@aws-sdk/*'
  - '@nodable/entities'
  - '@pkgr/core'
  - '@rc-component/menu'
  - '@radix-ui/*'
  - '@sentry-internal/*'
  - '@sentry/*'
  - '@smithy/*'
  - '@storybook/*'
  - '@tailwindcss/*'
  - '@tanstack/*'
  - '@testing-library/*'
  - '@types/*'
  - '@vitejs/*'
  - '@vitest/*'
  - axios
  - babel-plugin-react-compiler
  - devtools-protocol
  - electron-to-chromium
  - enhanced-resolve
  - eslint
  - eslint-module-utils
  - eslint-plugin-prettier
  - framer-motion
  - googleapis
  - hasown
  - i18next
  - lucide-react
  - playwright
  - react-router
  - react-router-dom
  - storybook
  - synckit
  - tailwindcss
  - tldts-core
  - typed-array-length
  - typescript
  - unplugin-swc
  - vite
  - vitest
  - zustand
